# Harness configuration. Model names live here and nowhere else.

models:
  prep: claude-sonnet-5-5
  interviewer: claude-sonnet-5-5
  user: claude-haiku-5-5
  debrief: claude-sonnet-5-5
  advocate: claude-opus-5-5
  synthesis: claude-opus-5-5

# Upper limit on each model reply. Generous on purpose: a reply cut off
# mid-JSON is worse than a few unused tokens.
max_tokens: 16000

# Stop rules. An interview stops at the first one that fires, or when the
# interviewer returns "end".
interview:
  max_interviewer_turns: 20
  token_budget_per_interview: 40000
  # Three answers in a row under 10 words means the interview has stalled.
  stall_answers: 3
  stall_min_words: 10

# Stop starting new interviews once the whole run has spent this many tokens.
run_token_cap: 1000000

# What each agent may see. build_context() refuses anything else.
# Later modules add the debrief, advocate and synthesis agents.
isolation:
  prep: [persona_summary, question_bank]
  interviewer: [prep, transcript]
  user: [persona_profile, recent_task, transcript]

# Relative to the repo root.
paths:
  personas: personas
  prompts: prompts
  runs: runs
  question_bank: docs/jtbd-interview-guides.md
